<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海岸贴图调试器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: auto; background: #1a1a2e; color: #eee; font-family: monospace; font-size: 13px; }
    #app { padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
    .toolbar button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; cursor: pointer; font-family: monospace; font-size: 12px; border-radius: 3px; }
    .toolbar button:hover { background: #4a9eff; color: #fff; }
    .toolbar button.active { background: #4a9eff; color: #fff; }
    .main-panels { display: flex; gap: 16px; flex-wrap: wrap; }
    .panel { background: #222; border: 1px solid #444; border-radius: 4px; padding: 10px; }
    .panel h3 { margin-bottom: 8px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .left-panel { flex: 0 0 auto; }
    .center-panel { flex: 0 0 auto; }
    .right-panel { flex: 1; min-width: 280px; }
    .bottom-panel { display: flex; gap: 16px; flex-wrap: wrap; }
    .bottom-panel .panel { flex: 1; min-width: 280px; }
    #debug-container { min-height: 160px; }
    .test-nav { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #aaa; }
    .test-nav span { color: #fff; }
    .missing-warning { background: #5a2a2a; border: 1px solid #a44; padding: 8px; border-radius: 3px; margin-bottom: 8px; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <button id="btn-new">新建测试</button>
      <button id="btn-gen">生成全部测试</button>
      <button id="btn-prev">上一个</button>
      <button id="btn-next">下一个</button>
      <span class="test-nav" id="test-nav"></span>
      <span style="flex:1"></span>
      <button id="btn-save">保存规则</button>
      <button id="btn-reset">重置规则</button>
      <button id="btn-export">导出规则</button>
    </div>
    <div id="missing-container"></div>
    <div class="main-panels">
      <div class="panel left-panel">
        <h3>地形网格 (7×7)</h3>
        <div id="terrain-container"></div>
      </div>
      <div class="panel center-panel">
        <h3>邻居编辑器 (3×3)</h3>
        <div id="neighbor-container"></div>
      </div>
      <div class="panel right-panel">
        <h3>预览</h3>
        <div id="preview-container"></div>
      </div>
    </div>
    <div class="bottom-panel">
      <div class="panel">
        <h3>规则编辑器</h3>
        <div id="rule-container"></div>
      </div>
      <div class="panel">
        <h3>调试信息</h3>
        <div id="debug-container"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/shore-debug/main.ts"></script>
</body>
</html>
